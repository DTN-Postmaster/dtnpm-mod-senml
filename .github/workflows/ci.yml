# Expects sibling checkouts of dtnpm-core (`../dtnpm-core`), dtnpm-web-core (`../dtnpm-web-core`), and hardy (`../../hardy`).
name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test-lint:
    name: SenML Telemetry Module Tests & SBOM
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: dtn-postmaster/dtnpm-mod-senml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dtn-postmaster/dtnpm-mod-senml
      - name: Formatting check
        working-directory: dtn-postmaster/dtnpm-mod-senml
        run: cargo fmt --all -- --check
      - name: Strict Clippy check (production targets)
        working-directory: dtn-postmaster/dtnpm-mod-senml
        run: cargo clippy --workspace --lib --bins -- -D warnings -D clippy::unwrap_used -D clippy::panic
      - name: Run cargo test --all-targets
        working-directory: dtn-postmaster/dtnpm-mod-senml
        run: cargo test --all-targets
      - name: Generate CycloneDX / SPDX SBOM (Syft)
        uses: anchore/sbom-action@v0
        with:
          path: dtn-postmaster/dtnpm-mod-senml
          output-file: dtn-postmaster/dtnpm-mod-senml/sbom.json
          format: cyclonedx-json
      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-dtnpm-mod-senml
          path: dtn-postmaster/dtnpm-mod-senml/sbom.json

  security-audit:
    name: Security & License Gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: dtn-postmaster/dtnpm-mod-senml
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dtn-postmaster/dtnpm-mod-senml
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-audit, cargo-deny, gitleaks
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install UI dependencies (for audit)
        working-directory: dtn-postmaster/dtnpm-mod-senml/ui
        run: pnpm install --frozen-lockfile
      - name: Run strict security checks
        working-directory: dtn-postmaster/dtnpm-mod-senml
        run: ./scripts/check-security.sh --strict

  code-coverage:
    name: Code Coverage (LCOV)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          path: dtn-postmaster/dtnpm-mod-senml
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: dtn-postmaster/dtnpm-mod-senml
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Generate LCOV coverage report
        working-directory: dtn-postmaster/dtnpm-mod-senml
        run: ./scripts/check-coverage.sh --lcov
      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-dtnpm-mod-senml
          path: dtn-postmaster/dtnpm-mod-senml/lcov.info
