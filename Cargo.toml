[package]
name = "dtnpm-mod-senml"
version = "0.2.0"
edition = "2024"
license = "Apache-2.0"
description = "DTN Postmaster SenML Telemetry module (RFC 8428 parser, SQLite storage, Axum/SSE routes, Open MCT API, Preact UI)"

[features]
default = ["cli"]
cli = ["dep:clap", "dep:tracing-subscriber"]

[[bin]]
name = "dtnpm-mod-senml"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
dtnpm-core = { path = "../dtnpm-core" }
dtnpm-web-core = { path = "../dtnpm-web-core" }
hardy-async = { path = "../../hardy/async" }
hardy-bpa = { path = "../../hardy/bpa" }
hardy-bpv7 = { path = "../../hardy/bpv7" }

anyhow = "1.0"
axum = "0.8"
bytes = "1.10"
ciborium = "0.2"
futures-util = "0.3"
rusqlite = { version = "0.40", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
time = { version = "0.3", features = ["formatting", "macros"] }
tokio = { version = "1.43", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tracing = "0.1"

clap = { version = "4.5", features = ["derive", "env"], optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }

[dev-dependencies]
tempfile = "3"
tokio = { version = "1.43", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
